# ==============================================================================
# 在 GitHub Actions 上构建镜像，并推送到 Docker Hub
#
# 为什么用云端构建（而不是本机）：
#   本机无需安装 Docker Desktop / WSL2，也不需要重启，
#   构建在 GitHub 的 runner 上完成，产物直接推到 Docker Hub。
#   之后任何机器只要一句 docker compose up -d 就能部署。
#
# —— 使用前只需做一次（约 3 分钟）——
#
#   1. 把本目录推到一个 GitHub 仓库（私有仓库也可以）
#
#   2. 到仓库 Settings → Secrets and variables → Actions → New repository secret
#        名称：DOCKERHUB_USERNAME   值：你的 Docker Hub 用户名
#        名称：DOCKERHUB_TOKEN      值：在 https://hub.docker.com/settings/security
#                                      点 "New Access Token" 生成的令牌
#      ⚠ 请使用 Access Token，不要用账号登录密码
#
#   3. 触发构建，任选一种：
#        · 到仓库 Actions 页面，选 "构建并推送镜像到 Docker Hub" → Run workflow
#        · 或者打标签推送：git tag v1.0 && git push origin v1.0
#
# —— 构建结果 ——
#   镜像地址：<DOCKERHUB_USERNAME>/qltoolsv2:latest
#   部署时在 .env 里填：IMAGE_REPO=<DOCKERHUB_USERNAME>/qltoolsv2
#
# —— 想推送到阿里云 ACR / 腾讯云 TCR？——
#   把下面 "登录 Docker Hub" 与 images 处的地址换成对应仓库即可，
#   凭据同样放到 Secrets 里。
# ==============================================================================

name: 构建并推送镜像到 Docker Hub

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  # 允许在网页上手动触发，并可指定镜像标签
  workflow_dispatch:
    inputs:
      tag:
        description: '要推送的镜像标签'
        required: false
        default: 'latest'

env:
  IMAGE_NAME: qltoolsv2
  # GitHub runner 在海外，优先官方 Go 代理；保留国内源作为回退
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 QEMU（用于跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # 默认分支构建 -> latest
            type=raw,value=latest,enable={{is_default_branch}}
            # 打 tag 推送 -> 用 tag 名（如 v1.0）
            type=ref,event=tag
            # 每次构建附带短提交号，便于回滚定位
            type=sha,format=short
            # 网页手动触发时用输入的标签
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 只构建 amd64，速度快（约 5-10 分钟）。
          # 若你的服务器是 ARM（如部分云主机、树莓派），
          # 改成：linux/amd64,linux/arm64 —— 但构建时间会明显变长
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
          # 复用构建缓存，后续构建只需 1-2 分钟
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送到 Docker Hub :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "部署时在项目 .env 里填：\`IMAGE_REPO=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
